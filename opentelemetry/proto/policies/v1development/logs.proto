syntax = "proto3";

package opentelemetry.proto.policies.v1development;

import "opentelemetry/proto/policies/v1development/common.proto";

option csharp_namespace = "OpenTelemetry.Proto.Policies.V1Development";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.policies.v1development";
option java_outer_classname = "PoliciesLogsProto";
option go_package = "go.opentelemetry.io/proto/otlp/policies/v1development";

// LogFilterPolicy keeps or drops a log record.
//
// A consumer evaluates each log record on its own. A log record that no filter
// policy matches passes through. When several filter policies match one log
// record, ACTION_KEEP overrides ACTION_DROP.
//
// Status: [Development]
//
// [Since next]
message LogFilterPolicy {
  // Conditions that a log record MUST satisfy.
  //
  // A consumer combines the matchers with AND: every matcher MUST report true
  // before the action applies. A policy MUST carry at least one matcher.
  //
  // [Since next]
  repeated LogMatcher matches = 1;

  // What happens to a log record that satisfies every matcher.
  //
  // The field is optional so that a consumer tells an unset action from
  // ACTION_UNSPECIFIED. A policy with an unset action is invalid.
  //
  // [Since next]
  optional Action action = 2;
}

// LogTransformPolicy modifies a log record that survives the filter stage.
//
// A consumer applies the operations in one fixed order: rename, then add,
// then remove, then redact. Within each operation stage, operations across
// all matching LogTransformPolicy rules run in ascending lexicographical
// (UTF-8 byte) order of Policy.id, and in list order within each policy. A
// consumer MUST NOT reorder the operations.
//
// A policy MUST carry at least one operation.
//
// Status: [Development]
//
// [Since next]
message LogTransformPolicy {
  // Conditions that a log record MUST satisfy.
  //
  // A consumer combines the matchers with AND: every matcher MUST report true
  // before the transform applies. When matches is empty, the policy matches
  // every log record.
  //
  // [Since next]
  repeated LogMatcher matches = 1;

  // Fields to rename.
  //
  // [Since next]
  repeated LogRename rename = 2;

  // Fields to insert.
  //
  // [Since next]
  repeated LogAdd add = 3;

  // Fields to delete. A field that is absent yields no change.
  //
  // [Since next]
  repeated LogRemove remove = 4;

  // Field values to mask.
  //
  // [Since next]
  repeated LogRedact redact = 5;
}

// LogMatcher evaluates one predicate against one log target.
//
// Status: [Development]
//
// [Since next]
message LogMatcher {
  // The field, the attribute, or the metadata to inspect.
  //
  // [Since next]
  LogFieldSelector target = 1;

  // How to compare the value that target selects.
  //
  // [Since next]
  Predicate predicate = 2;

  // Inverts the result of the predicate.
  //
  // [Since next]
  bool negate = 3;
}

// LogFieldSelector names one log target. Exactly one variant MUST be set.
//
// Status: [Development]
//
// [Since next]
message LogFieldSelector {
  // The target. Exactly one variant MUST be set.
  //
  // [Since next]
  oneof target {
    // A first-class field of a log record.
    //
    // [Since next]
    LogRecordField record_field = 1;

    // A log record attribute, for example ["http.route"].
    //
    // [Since next]
    AttributePath log_attribute = 2;

    // A resource attribute, for example ["service.name"].
    //
    // [Since next]
    AttributePath resource_attribute = 3;

    // An instrumentation scope attribute.
    //
    // [Since next]
    AttributePath scope_attribute = 4;

    // A first-class field of the instrumentation scope.
    //
    // [Since next]
    ScopeField scope_field = 5;

    // A nested field inside a structured (KeyValueList) log record body, for
    // example ["user", "id"].
    //
    // When the log record body is not a KeyValueList map, or when the path
    // does not resolve inside it, the target is treated as absent.
    //
    // [Since next]
    AttributePath body_field = 6;
  }
}

// LogTargetSelector names one mutable field or attribute owned by a log
// record. Exactly one variant MUST be set.
//
// Status: [Development]
//
// [Since next]
message LogTargetSelector {
  // The mutable log record target. Exactly one variant MUST be set.
  //
  // [Since next]
  oneof target {
    // A first-class field of the log record.
    //
    // [Since next]
    LogRecordField record_field = 1;

    // A log record attribute, for example ["http.route"].
    //
    // [Since next]
    AttributePath log_attribute = 2;

    // A nested field inside a structured (KeyValueList) log record body, for
    // example ["user", "id"].
    //
    // [Since next]
    AttributePath body_field = 3;
  }
}

// LogAttributeSelector names one attribute or structured body path owned by a
// log record. Exactly one variant MUST be set.
//
// Status: [Development]
//
// [Since next]
message LogAttributeSelector {
  // The attribute path target. Exactly one variant MUST be set.
  //
  // [Since next]
  oneof target {
    // A log record attribute, for example ["http.route"].
    //
    // [Since next]
    AttributePath log_attribute = 1;

    // A nested field inside a structured (KeyValueList) log record body, for
    // example ["user", "id"].
    //
    // [Since next]
    AttributePath body_field = 2;
  }
}

// LogRemove deletes one field or attribute from a log record.
//
// Status: [Development]
//
// [Since next]
message LogRemove {
  // The log record field or attribute to delete.
  //
  // [Since next]
  LogTargetSelector target = 1;
}

// LogRedact masks a field value, or a part of a field value, on a log record.
//
// Status: [Development]
//
// [Since next]
message LogRedact {
  // The log record field or attribute to mask.
  //
  // [Since next]
  LogTargetSelector target = 1;

  // The text that replaces the matched range. The default is "[REDACTED]".
  //
  // When regex is set, the text is a template. A consumer MUST expand "$0" to
  // the full match, "$1" through "$99" and "${1}" through "${99}" to a
  // numbered capture group, "${name}" to a named capture group, and "$$" to a
  // literal dollar sign. A reference to an absent capture group expands to the
  // empty string.
  //
  // [Since next]
  optional string replacement = 2;

  // An optional RE2 expression that narrows the replacement.
  //
  // When regex is unset, the whole field value is replaced with replacement on
  // string fields (LOG_RECORD_FIELD_SEVERITY_TEXT, LOG_RECORD_FIELD_EVENT_NAME)
  // and AnyValue targets (LOG_RECORD_FIELD_BODY, log_attribute, body_field);
  // targeting a non-string typed record field (LOG_RECORD_FIELD_SEVERITY_NUMBER,
  // LOG_RECORD_FIELD_TRACE_ID, LOG_RECORD_FIELD_SPAN_ID) yields no change.
  // When regex is set and the expression matches, every non-overlapping full
  // match is replaced. A capture group supplies text for the template but does
  // not widen or narrow the replaced range. When the expression does not
  // match, or when the field value is not a string, the operation yields no
  // change.
  //
  // [Since next]
  optional string regex = 3;
}

// LogRename moves an attribute or structured body field to a new key path on a
// log record.
//
// Status: [Development]
//
// [Since next]
message LogRename {
  // The source attribute or structured body path to rename. A source that is
  // absent yields no change.
  //
  // [Since next]
  LogAttributeSelector from = 1;

  // The destination attribute or structured body path.
  //
  // [Since next]
  LogAttributeSelector to = 2;

  // Overwrites the destination field when it already holds a value. When
  // upsert is false and the destination already exists, the operation yields
  // no change and the source field is preserved.
  //
  // [Since next]
  bool upsert = 3;
}

// LogAdd inserts or overwrites one field or attribute on a log record.
//
// Status: [Development]
//
// [Since next]
message LogAdd {
  // The log record field or attribute to insert.
  //
  // [Since next]
  LogTargetSelector target = 1;

  // The value to set. Setting a value whose type is incompatible with a
  // fixed-type record_field yields no change.
  //
  // [Since next]
  ScalarValue value = 2;

  // Overwrites the field when it already holds a value. When upsert is false
  // and the field already exists, the operation yields no change.
  //
  // [Since next]
  bool upsert = 3;
}

// LogRecordField identifies a first-class field of a log record.
//
// These fields carry no presence information in the OpenTelemetry data model.
// The exists predicate therefore reports true when the field holds a
// non-default value.
//
// Status: [Development]
//
// [Since next]
enum LogRecordField {
  // The field is not set. A selector with an unset field is invalid.
  //
  // [Since next]
  LOG_RECORD_FIELD_UNSPECIFIED = 0;

  // The body of the log record.
  //
  // [Since next]
  LOG_RECORD_FIELD_BODY = 1;

  // The severity of the log record as text, for example "INFO" or "ERROR".
  //
  // [Since next]
  LOG_RECORD_FIELD_SEVERITY_TEXT = 2;

  // The severity of the log record as a number from 1 to 24.
  //
  // The equals predicate and the comparison predicates read the number. The
  // regex predicate reads the canonical base-10 text, for example "17".
  //
  // [Since next]
  LOG_RECORD_FIELD_SEVERITY_NUMBER = 3;

  // The trace id of the log record.
  //
  // A predicate reads the canonical 32-character lowercase hexadecimal text,
  // as the W3C Trace Context specification defines it. An empty or all-zero
  // (16 zero bytes) trace id MUST be treated as absent: the exists predicate
  // reports false, and a string predicate reads the empty text "".
  //
  // [Since next]
  LOG_RECORD_FIELD_TRACE_ID = 4;

  // The span id of the log record.
  //
  // A predicate reads the canonical 16-character lowercase hexadecimal text,
  // as the W3C Trace Context specification defines it. An empty or all-zero
  // (8 zero bytes) span id MUST be treated as absent: the exists predicate
  // reports false, and a string predicate reads the empty text "".
  //
  // [Since next]
  LOG_RECORD_FIELD_SPAN_ID = 5;

  // The event name of the log record.
  //
  // [Since next]
  LOG_RECORD_FIELD_EVENT_NAME = 6;
}
