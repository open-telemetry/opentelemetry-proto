syntax = "proto3";

package opentelemetry.proto.policies.v1development;

import "opentelemetry/proto/policies/v1development/common.proto";

option csharp_namespace = "OpenTelemetry.Proto.Policies.V1Development";
option java_multiple_files = true;
option java_package = "io.opentelemetry.proto.policies.v1development";
option java_outer_classname = "PoliciesMetricsProto";
option go_package = "go.opentelemetry.io/proto/otlp/policies/v1development";

// MetricFilterPolicy keeps or drops a metric stream, or single data points of
// a metric stream.
//
// The matchers set the granularity. When every matcher selects a metric-level
// target, that is descriptor_field, resource_attribute, scope_attribute, or
// scope_field, the action applies to the whole metric stream. When any matcher
// selects datapoint_attribute, the action applies to each data point on its
// own, so a drop prunes the matching data points and leaves the rest.
//
// A consumer that prunes every data point of a metric stream MUST also drop
// the empty metric, and MUST drop a ScopeMetrics or a ResourceMetrics that the
// prune leaves empty.
//
// A metric that no filter policy matches passes through. When several filter
// policies match one metric or one data point, ACTION_KEEP overrides
// ACTION_DROP.
//
// Status: [Development]
//
// [Since next]
message MetricFilterPolicy {
  // Conditions that a metric or a data point MUST satisfy.
  //
  // A consumer combines the matchers with AND: every matcher MUST report true
  // before the action applies. A policy MUST carry at least one matcher.
  //
  // [Since next]
  repeated MetricMatcher matches = 1;

  // What happens to a metric or a data point that satisfies every matcher.
  //
  // The field is optional so that a consumer tells an unset action from
  // ACTION_UNSPECIFIED. A policy with an unset action is invalid.
  //
  // [Since next]
  optional Action action = 2;
}

// MetricMatcher evaluates one predicate against one metric target.
//
// Status: [Development]
//
// [Since next]
message MetricMatcher {
  // The field, the attribute, or the metadata to inspect.
  //
  // [Since next]
  MetricFieldSelector target = 1;

  // How to compare the value that target selects.
  //
  // [Since next]
  Predicate predicate = 2;

  // Inverts the result of the predicate.
  //
  // [Since next]
  bool negate = 3;
}

// MetricFieldSelector names one metric target. Exactly one variant MUST be
// set.
//
// Status: [Development]
//
// [Since next]
message MetricFieldSelector {
  // The target. Exactly one variant MUST be set.
  //
  // [Since next]
  oneof target {
    // A descriptor field of the metric.
    //
    // [Since next]
    MetricDescriptorField descriptor_field = 1;

    // An attribute of a single data point, for example ["http.status_code"].
    //
    // [Since next]
    AttributePath datapoint_attribute = 2;

    // A resource attribute, for example ["service.name"].
    //
    // [Since next]
    AttributePath resource_attribute = 3;

    // An instrumentation scope attribute.
    //
    // [Since next]
    AttributePath scope_attribute = 4;

    // A first-class field of the instrumentation scope.
    //
    // [Since next]
    ScopeField scope_field = 5;
  }
}

// MetricDescriptorField identifies a descriptor field of a metric.
//
// These fields carry no presence information in the OpenTelemetry data model.
// The exists predicate therefore reports true when the field holds a
// non-default value.
//
// Status: [Development]
//
// [Since next]
enum MetricDescriptorField {
  // The field is not set. A selector with an unset field is invalid.
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_UNSPECIFIED = 0;

  // The name of the metric, for example "http.server.request.duration".
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_NAME = 1;

  // The description of the metric.
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_DESCRIPTION = 2;

  // The unit of the metric, for example "ms", "By", or "1".
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_UNIT = 3;

  // The data type of the metric.
  //
  // A predicate reads the uppercase name of the type: "GAUGE", "SUM",
  // "HISTOGRAM", "EXPONENTIAL_HISTOGRAM", or "SUMMARY".
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_TYPE = 4;

  // The aggregation temporality of a Sum, a Histogram, or an
  // ExponentialHistogram.
  //
  // A predicate reads the uppercase name of the temporality: "DELTA" or
  // "CUMULATIVE". A metric type that carries no temporality does not match.
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_AGGREGATION_TEMPORALITY = 5;

  // Whether a Sum is monotonic.
  //
  // The equals predicate reads the boolean. The regex predicate reads the text
  // "true" or "false". A metric type other than a Sum does not match.
  //
  // [Since next]
  METRIC_DESCRIPTOR_FIELD_IS_MONOTONIC = 6;
}
